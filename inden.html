<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Disney Birthday</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#dcebf8;--card:#ffffff;--ink:#1b2a4a;--sub:#5a6a8a;--red:#e0405a;--sun:#ffc93c;--mint:#2f9e7a;--line:#c3d4ea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101a30;--card:#1a2744;--ink:#eef3ff;--sub:#9db0d4;--red:#ff7088;--sun:#ffd25e;--mint:#58d3a8;--line:#2d3d63;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101a30;--card:#1a2744;--ink:#eef3ff;--sub:#9db0d4;--red:#ff7088;--sun:#ffd25e;--mint:#58d3a8;--line:#2d3d63;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;font-weight:500;line-height:1.6;min-height:100vh}
main{max-width:520px;margin:0 auto;padding:20px 16px 40px}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:700;color:var(--sub);font-size:14px;margin-bottom:12px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:18px}
.bar i{display:block;height:100%;width:0;background:var(--red);transition:width .3s}
.cal{background:var(--card);border-radius:18px;border-top:34px solid var(--red);text-align:center;padding:14px 12px 20px;box-shadow:0 2px 0 var(--line);position:relative}
.cal:before,.cal:after{content:"";position:absolute;top:-24px;width:10px;height:18px;border-radius:5px;background:var(--card)}
.cal:before{left:28%}.cal:after{right:28%}
.yr{font-size:40px;color:var(--ink);font-weight:900;line-height:1.2;letter-spacing:.04em}
.day{font-size:64px;font-weight:900;line-height:1.1;letter-spacing:.02em}
.day small{font-size:24px;font-weight:700;margin:0 4px 0 2px}
.q{margin:14px 0 0;font-size:15px;color:var(--sub);font-weight:700}
.choices{display:grid;gap:10px;margin-top:16px}
button.c{font:inherit;font-weight:700;font-size:18px;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px 16px;text-align:left;cursor:pointer;min-height:56px}
button.c:focus-visible,button.go:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
button.c.ok{border-color:var(--mint);background:var(--mint);color:#fff}
button.c.ng{border-color:var(--red);background:var(--red);color:#fff}
button.c:disabled{cursor:default}
.fb{min-height:52px;margin-top:14px;font-weight:700}
button.go{font:inherit;font-weight:900;font-size:18px;background:var(--sun);color:#1b2a4a;border:0;border-radius:14px;padding:14px 20px;width:100%;cursor:pointer;margin-top:8px}
.res{text-align:center}
.score{font-size:80px;font-weight:900;line-height:1.1}
.score small{font-size:28px}
ul.rv{list-style:none;padding:0;margin:18px 0;text-align:left}
ul.rv li{padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
ul.rv b{color:var(--mint)}ul.rv s{color:var(--red);text-decoration-thickness:2px}
button.hint{font:inherit;font-weight:700;font-size:15px;color:var(--ink);background:transparent;border:2px dashed var(--sun);border-radius:12px;padding:8px 16px;margin-top:14px;cursor:pointer}
button.hint:disabled{border-style:solid;cursor:default}
button.hint:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.hn{min-height:28px;margin:8px 0 0;font-weight:700;text-align:center}
a{color:var(--red);font-weight:700}

  hints++;used=true;$("hc").textContent="ヒント "+hints+"回";
  $("hn").textContent="デビュー作品：「"+H[Q[i].d[2]]+"」";
  $("hb").disabled=true;$("hb").textContent="ヒント表示中";
};
$("next").onclick=function(){
  if(i===9){finish();return}
  i++;show();
};
function finish(){
  $("play").classList.add("hide");$("end").classList.remove("hide");
  $("fs").textContent=score;$("fh").textContent=hints;
  $("msg").textContent=score===10?"全問正解です。誕生日マスターです！":score>=7?"よくできました。かなりの物知りです。":score>=4?"あと少しです。もう一度挑戦してみましょう。":"まずは誕生日一覧を見てからもう一度どうぞ。";
  $("rv").innerHTML=log.map(function(l,k){
    var d=l.d;
    return"<li>"+(k+1)+". "+d[3]+"年"+d[0]+"月"+d[1]+"日："+(l.ok?"<b>"+d[2]+"</b>":"<s>"+l.pick+"</s> → "+d[2])+(l.hint?"（ヒント使用）":"")+" <a href=\"https://www.google.com/search?q="+encodeURIComponent(d[2]+" 誕生日 デビュー作品")+"\" target=\"_blank\" rel=\"noopener\">調べる</a></li>";
  }).join("");
  $("pb").style.width="100%";
  window.scrollTo(0,0);
}
$("again").onclick=start;
$("startbtn").onclick=function(){$("intro").classList.add("hide");start();window.scrollTo(0,0)};
start();
</script>
</body>
</html>
